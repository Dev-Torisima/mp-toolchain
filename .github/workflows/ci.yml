name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.4.0)'
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup .NET
      # ----------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      # ----------------------------------------
      # Setup Python
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # ----------------------------------------
      # Publish
      # ----------------------------------------
      - name: Publish compiler
        shell: cmd
        run: |
          call shells\publish-compiler.cmd

      # ----------------------------------------
      # Package
      # ----------------------------------------
      - name: Package compiler
        shell: pwsh
        run: |
          python shells/package-compiler.py

      # ----------------------------------------
      # Upload build artifacts
      # ----------------------------------------
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: compiler-packages
          path: |
            package/**/*.zip
          if-no-files-found: error

  test:
    name: Test - ${{ matrix.name }}

    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            rid: win-x64

          - name: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64

          - name: osx-arm64
            runner: macos-15
            rid: osx-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Download build artifacts
      # ----------------------------------------
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: compiler-packages
          path: artifacts


      - name: Debug artifact structure
        shell: pwsh
        run: |
          Write-Host "=== Artifact directory ==="

          Get-ChildItem `
            -Path artifacts `
            -Recurse `
            -Force |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=== ZIP files ==="

          Get-ChildItem `
            -Path artifacts `
            -Filter *.zip `
            -Recurse `
            -Force |
            ForEach-Object {
              Write-Host $_.FullName
            }



      # ----------------------------------------
      # Setup Python
      # ----------------------------------------
      # ZIP展開をWindows/Linux/macOSで共通化するために使用
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # ----------------------------------------
      # Find package.zip
      # ----------------------------------------
      - name: Find package
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"

          Write-Host "Looking for package for RID: $rid"

          $package = Get-ChildItem `
            -Path artifacts `
            -Filter "*_${rid}.zip" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $package) {
            Write-Error "Package for RID '$rid' was not found."

            Write-Host ""
            Write-Host "Available ZIP files:"
            Get-ChildItem `
              -Path artifacts `
              -Filter "*.zip" `
              -Recurse `
              -File |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Found package:"
          Write-Host $package.FullName

          "PACKAGE_PATH=$($package.FullName)" >> $env:GITHUB_ENV

      # ----------------------------------------
      # Extract package.zip
      # ----------------------------------------
      - name: Extract compiler
        shell: pwsh
        run: |
          $extractDir = Join-Path $env:GITHUB_WORKSPACE "compiler"

          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extractDir | Out-Null

          python -c "import zipfile; zipfile.ZipFile(r'$env:PACKAGE_PATH').extractall(r'$extractDir')"

          Write-Host "=== Extracted compiler ==="
          Get-ChildItem $extractDir -Recurse

      # ----------------------------------------
      # Linux/macOS: make compiler executable
      # ----------------------------------------
      - name: Make compiler executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./compiler/mpcom

      # ----------------------------------------
      # Compiler test
      # ----------------------------------------
      - name: Compiler test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./compiler/mpcom.exe --debug
          else
            ./compiler/mpcom --debug
          fi

  release:
    name: Release
    needs:
      - build
      - test

    permissions:
      contents: write

    runs-on: ubuntu-24.04

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
    
      # ----------------------------------------
      # Download build artifacts
      # ----------------------------------------
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: compiler-packages
          path: artifacts

      # ----------------------------------------
      # Inspect release packages
      # ----------------------------------------
      - name: List release packages
        shell: bash
        run: |
          echo "=== Release packages ==="
          find artifacts -type f -name '*.zip' -print

      # ----------------------------------------
      # Validate package count
      # ----------------------------------------
      - name: Validate release packages
        shell: bash
        run: |
          count=$(find artifacts -type f -name '*.zip' | wc -l)

          echo "Found $count package(s)"

          if [ "$count" -ne 8 ]; then
            echo "Expected 8 packages, but found $count."
            exit 1
          fi

      # ----------------------------------------
      # Create GitHub Release
      # ----------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          mapfile -t packages < <(
            find artifacts \
              -type f \
              -name '*.zip' \
              -print
          )

          echo "Creating release: $RELEASE_TAG"
          echo "Target commit: $GITHUB_SHA"

          gh release create "$RELEASE_TAG" \
            "${packages[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
